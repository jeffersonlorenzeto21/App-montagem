<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

:root{
  --bg:#F4F3EF;
  --panel:#FFFFFF;
  --panel-2:#F7F6F3;
  --panel-3:#ECEAE5;
  --border:#DEDCD5;
  --text:#2B2B27;
  --text-dim:#6E6E67;
  --text-faint:#9A9992;
  --orange:#3F3F3A;
  --orange-soft:#EAE9E5;
  --blue:#5B7C8A;
  --green:#4C8C4A;
  --green-soft:#E4F0E3;
  --amber:#A9791E;
  --amber-soft:#FBF0DC;
  --red:#B23A31;
  --red-soft:#FBE7E5;
  --mono:'JetBrains Mono', monospace;
  --display:'Oswald', sans-serif;
  --body:'Inter', sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--body);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--orange);color:#FFFFFF;}

/* ---------- layout ---------- */
.app{display:flex;min-height:100vh;}
.sidebar{
  width:230px;
  flex-shrink:0;
  background:var(--panel);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  padding:20px 14px;
  position:sticky;
  top:0;
  height:100vh;
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
  padding:4px 8px 20px 8px;
  border-bottom:1px solid var(--border);
  margin-bottom:16px;
}
.lider-logo{
  background:#F4F2ED;
  border-radius:8px;
  padding:16px 12px 14px 12px;
  text-align:center;
  margin-bottom:16px;
}
.lider-logo .wordmark{
  font-family:var(--display);
  font-weight:300;
  font-size:22px;
  letter-spacing:9px;
  color:#4B4B45;
  text-indent:9px;
  line-height:1;
}
.lider-logo .tagline{
  display:block;
  margin-top:6px;
  font-family:var(--body);
  font-size:9px;
  letter-spacing:2px;
  text-transform:uppercase;
  color:#9A9A92;
}
.brand-mark{
  width:34px;height:34px;
  background:var(--orange);
  border-radius:4px;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--display);
  font-weight:700;
  color:#FFFFFF;
  font-size:16px;
  letter-spacing:-0.5px;
  flex-shrink:0;
}
.brand-text{display:flex;flex-direction:column;line-height:1.15;}
.brand-text b{font-family:var(--display);font-size:15px;letter-spacing:0.5px;font-weight:600;}
.brand-text span{font-size:10.5px;color:var(--text-faint);letter-spacing:0.6px;text-transform:uppercase;}

.nav-group{margin-bottom:18px;}
.nav-label{
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:1.2px;
  color:var(--text-faint);
  padding:0 10px 8px 10px;
  font-weight:600;
}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 10px;
  border-radius:6px;
  color:var(--text-dim);
  cursor:pointer;
  font-size:13.5px;
  font-weight:500;
  margin-bottom:2px;
  border:1px solid transparent;
  transition:background .12s ease;
}
.nav-item svg{width:16px;height:16px;flex-shrink:0;opacity:.85;}
.nav-item:hover{background:var(--panel-2);color:var(--text);}
.nav-item.active{background:var(--orange-soft);color:var(--orange);border-color:#D3D1CA;}
.nav-item.active svg{opacity:1;}
.nav-count{
  margin-left:auto;
  font-family:var(--mono);
  font-size:10.5px;
  color:var(--text-faint);
  background:var(--panel-3);
  padding:1px 6px;
  border-radius:10px;
}
.sidebar-foot{
  margin-top:auto;
  padding:10px 8px;
  border-top:1px solid var(--border);
  font-size:10.5px;
  color:var(--text-faint);
  line-height:1.5;
}

.main{flex:1;min-width:0;padding:28px 34px 60px 34px;max-width:1180px;}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:26px;gap:16px;flex-wrap:wrap;}
.topbar h1{
  font-family:var(--display);
  font-size:26px;
  font-weight:600;
  letter-spacing:0.3px;
  margin:0 0 4px 0;
}
.topbar p{margin:0;color:var(--text-dim);font-size:13px;max-width:520px;}
.btn{
  display:inline-flex;align-items:center;gap:7px;
  background:var(--orange);
  color:#FFFFFF;
  border:none;
  padding:10px 16px;
  border-radius:6px;
  font-family:var(--body);
  font-weight:600;
  font-size:13px;
  cursor:pointer;
  transition:filter .12s ease;
}
.btn:hover{filter:brightness(1.08);}
.btn:active{filter:brightness(0.95);}
.btn.secondary{background:var(--panel-3);color:var(--text);border:1px solid var(--border);}
.btn.ghost{background:transparent;color:var(--text-dim);border:1px solid var(--border);}
.btn.small{padding:6px 11px;font-size:12px;}
.btn:disabled{opacity:.4;cursor:not-allowed;}

/* ---------- stat cards ---------- */
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:26px;}
.stat-card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:8px;
  padding:16px 16px 14px 16px;
  position:relative;
  overflow:hidden;
}
.stat-card .stat-num{font-family:var(--display);font-size:28px;font-weight:600;}
.stat-card .stat-label{font-size:11.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.6px;margin-top:2px;}
.stat-card.accent-orange .stat-num{color:var(--orange);}
.stat-card.accent-amber .stat-num{color:var(--amber);}
.stat-card.accent-red .stat-num{color:var(--red);}
.stat-card.accent-green .stat-num{color:var(--green);}
.stat-card.accent-blue .stat-num{color:var(--blue);}

.section-title{
  font-family:var(--display);
  font-size:14px;
  font-weight:600;
  letter-spacing:0.6px;
  text-transform:uppercase;
  color:var(--text-dim);
  margin:0 0 12px 0;
  display:flex;align-items:center;gap:8px;
}
.section-title::after{content:"";flex:1;height:1px;background:var(--border);}

/* ---------- ticket/table cards ---------- */
.card-list{display:flex;flex-direction:column;gap:8px;margin-bottom:28px;}
.ticket{
  background:var(--panel);
  border:1px solid var(--border);
  border-left:3px solid var(--panel-3);
  border-radius:6px;
  padding:13px 16px;
  display:flex;
  align-items:center;
  gap:16px;
  cursor:pointer;
  transition:border-color .12s ease, background .12s ease;
}
.ticket:hover{background:var(--panel-2);border-color:#4a5157;}
.ticket .tnum{
  font-family:var(--mono);
  font-size:12px;
  color:var(--text-faint);
  min-width:118px;
  flex-shrink:0;
}
.ticket .tmain{flex:1;min-width:0;}
.ticket .tmain b{font-size:13.5px;font-weight:600;display:block;}
.ticket .tmain small{color:var(--text-dim);font-size:12px;}
.ticket .tdate{font-family:var(--mono);font-size:11.5px;color:var(--text-faint);flex-shrink:0;min-width:80px;text-align:right;}

.badge{
  font-family:var(--body);
  font-size:10.5px;
  font-weight:600;
  padding:4px 9px;
  border-radius:20px;
  text-transform:uppercase;
  letter-spacing:0.4px;
  flex-shrink:0;
  white-space:nowrap;
}
.badge.green{background:var(--green-soft);color:var(--green);}
.badge.amber{background:var(--amber-soft);color:var(--amber);}
.badge.red{background:var(--red-soft);color:var(--red);}
.badge.blue{background:#1a2831;color:var(--blue);}
.badge.gray{background:var(--panel-3);color:var(--text-dim);}

.empty{
  border:1px dashed var(--border);
  border-radius:8px;
  padding:34px 20px;
  text-align:center;
  color:var(--text-faint);
  font-size:13px;
}
.empty b{display:block;color:var(--text-dim);font-size:14px;margin-bottom:4px;font-family:var(--display);font-weight:500;}

/* ---------- filters ---------- */
.filters{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
.filters input[type=text]{
  background:var(--panel);border:1px solid var(--border);color:var(--text);
  padding:9px 12px;border-radius:6px;font-size:13px;font-family:var(--body);min-width:220px;flex:1;
}
.filters select{
  background:var(--panel);border:1px solid var(--border);color:var(--text);
  padding:9px 10px;border-radius:6px;font-size:12.5px;font-family:var(--body);
}
.filters input:focus,.filters select:focus{outline:2px solid var(--orange);outline-offset:-1px;}

/* ---------- forms ---------- */
.form-card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:26px 26px 22px 26px;max-width:760px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.field{margin-bottom:16px;display:flex;flex-direction:column;gap:6px;}
.field.full{grid-column:1/-1;}
.field label{font-size:12px;font-weight:600;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.4px;}
.field .hint{font-size:11px;color:var(--text-faint);font-weight:400;text-transform:none;letter-spacing:0;}
input[type=text],input[type=date],input[type=tel],textarea,select.form-select{
  background:var(--panel-2);
  border:1px solid var(--border);
  color:var(--text);
  padding:10px 12px;
  border-radius:6px;
  font-family:var(--body);
  font-size:13.5px;
  width:100%;
}
textarea{resize:vertical;min-height:70px;font-family:var(--body);}
input:focus,textarea:focus,select:focus{outline:2px solid var(--orange);outline-offset:-1px;border-color:var(--orange);}
fieldset{border:1px solid var(--border);border-radius:8px;padding:14px 16px 6px 16px;margin:0 0 16px 0;}
legend{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-dim);padding:0 6px;}
.check-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;}
.check-row{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:13px;}
.check-row input{width:16px;height:16px;accent-color:var(--orange);flex-shrink:0;}
.form-actions{display:flex;gap:10px;margin-top:6px;padding-top:16px;border-top:1px solid var(--border);}
.req::after{content:" *";color:var(--orange);}

/* ---------- detail / stamp ---------- */
.detail-wrap{max-width:760px;}
.detail-head{
  display:flex;justify-content:space-between;align-items:flex-start;
  background:var(--panel);border:1px solid var(--border);border-radius:10px 10px 0 0;
  padding:20px 24px;position:relative;overflow:hidden;
}
.detail-head .num{font-family:var(--mono);font-size:12px;color:var(--text-faint);letter-spacing:0.5px;}
.detail-head h2{font-family:var(--display);font-size:21px;font-weight:600;margin:4px 0 2px 0;}
.detail-head .sub{color:var(--text-dim);font-size:13px;}
.stamp{
  font-family:var(--display);
  font-weight:700;
  font-size:13px;
  letter-spacing:1.5px;
  text-transform:uppercase;
  border:2.5px solid currentColor;
  border-radius:4px;
  padding:6px 12px;
  transform:rotate(-6deg);
  flex-shrink:0;
  white-space:nowrap;
}
.stamp.green{color:var(--green);}
.stamp.amber{color:var(--amber);}
.stamp.red{color:var(--red);}
.stamp.blue{color:var(--blue);}
.stamp.gray{color:var(--text-faint);}

.detail-body{background:var(--panel);border:1px solid var(--border);border-top:none;border-radius:0 0 10px 10px;padding:22px 24px 24px 24px;}
.dl{display:grid;grid-template-columns:1fr 1fr;gap:14px 22px;margin-bottom:18px;}
.dl div b{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-faint);margin-bottom:3px;font-weight:600;}
.dl div span{font-size:13.5px;}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;}
.chip{background:var(--panel-3);border:1px solid var(--border);padding:3px 10px;border-radius:20px;font-size:11.5px;color:var(--text);}
.check-list{list-style:none;padding:0;margin:6px 0 0 0;display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;}
.check-list li{font-size:12.5px;display:flex;align-items:center;gap:7px;color:var(--text-dim);}
.check-list li.ok{color:var(--text);}
.check-list li .dot{width:7px;height:7px;border-radius:50%;background:var(--border);flex-shrink:0;}
.check-list li.ok .dot{background:var(--green);}
.note-box{background:var(--panel-2);border:1px solid var(--border);border-radius:6px;padding:12px 14px;font-size:13px;color:var(--text-dim);white-space:pre-wrap;}

.history{margin-top:18px;border-top:1px solid var(--border);padding-top:16px;}
.history-item{display:flex;gap:12px;padding:9px 0;border-bottom:1px dashed var(--border);}
.history-item:last-child{border-bottom:none;}
.history-item .hdate{font-family:var(--mono);font-size:11px;color:var(--text-faint);min-width:118px;flex-shrink:0;padding-top:1px;}
.history-item .htxt{font-size:13px;color:var(--text);}
.status-update{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;align-items:center;}
.status-update select{max-width:200px;}
.status-update input[type=text]{flex:1;min-width:180px;}

.modal-overlay{position:fixed;inset:0;background:rgba(10,12,14,0.7);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:50;}
.modal-close{position:sticky;top:0;display:flex;justify-content:flex-end;max-width:760px;margin:0 auto -6px auto;}
.modal-close button{background:var(--panel-3);border:1px solid var(--border);color:var(--text);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:16px;}

.toast{
  position:fixed;bottom:22px;right:22px;
  background:var(--panel-3);border:1px solid var(--border);border-left:3px solid var(--green);
  color:var(--text);padding:12px 18px;border-radius:6px;font-size:13px;z-index:100;
  box-shadow:0 8px 24px rgba(0,0,0,0.35);
}

.loading-state{padding:60px 0;text-align:center;color:var(--text-faint);font-size:13px;}

@media print{
  .sidebar,.topbar .btn,.no-print{display:none !important;}
  body{background:#fff;color:#111;}
  .main{padding:0;max-width:none;}
  .detail-head,.detail-body{background:#fff;border-color:#ccc;color:#111;}
  .note-box{background:#f4f4f4;color:#111;}
}
@media (max-width:820px){
  .sidebar{position:fixed;left:-240px;transition:left .2s ease;z-index:40;}
  .sidebar.open{left:0;}
  .form-grid{grid-template-columns:1fr;}
  .stat-row{grid-template-columns:1fr 1fr;}
  .dl{grid-template-columns:1fr;}
  .check-list{grid-template-columns:1fr;}
  .main{padding:70px 16px 60px 16px;}
  .mobile-menu-btn{display:flex;}
}
.mobile-menu-btn{
  display:none;
  position:fixed;
  top:14px;
  left:14px;
  z-index:50;
  width:42px;height:42px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:8px;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  box-shadow:0 2px 8px rgba(0,0,0,0.08);
}
.mobile-menu-btn svg{width:20px;height:20px;color:var(--text);}
.sidebar-overlay{
  display:none;
  position:fixed;inset:0;
  background:rgba(20,20,18,0.35);
  z-index:39;
}
.sidebar-overlay.open{display:block;}
</style>
</head>
<body>
<div class="app">

  <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Abrir menu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <aside class="sidebar" id="sidebar">
    <div class="lider-logo">
      <div class="wordmark">LIDER</div>
      <span class="tagline">Gestão de Montagem</span>
    </div>

    <div class="nav-group">
      <div class="nav-label">Visão geral</div>
      <div class="nav-item" data-view="dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        Painel
      </div>
    </div>

    <div class="nav-group">
      <div class="nav-label">Montagens</div>
      <div class="nav-item" data-view="nova-montagem">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>
        Registrar montagem
      </div>
      <div class="nav-item" data-view="montagens">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 4h10M9 10h10M9 16h10M4 4h.01M4 10h.01M4 16h.01"/></svg>
        Montagens do mês
        <span class="nav-count" id="count-montagens">0</span>
      </div>
    </div>

    <div class="nav-group">
      <div class="nav-label">Assistência técnica</div>
      <div class="nav-item" data-view="nova-assistencia">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>
        Abrir chamado
      </div>
      <div class="nav-item" data-view="assistencias">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14.7 6.3a4 4 0 0 1-5.66 5.66L4 17v3h3l5-5.04a4 4 0 0 1 5.66-5.66l-3-3z"/></svg>
        Chamados
        <span class="nav-count" id="count-assistencias">0</span>
      </div>
    </div>

    <div class="nav-group">
      <div class="nav-label">Dados</div>
      <div class="nav-item" data-view="backup">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
        Backup
      </div>
    </div>

    <div class="sidebar-foot" id="sidebar-foot">
      Dados salvos e compartilhados entre todos os usuários desta ferramenta.
    </div>
  </aside>

  <main class="main" id="main">
    <div class="loading-state">Carregando dados…</div>
  </main>

</div>

<script>
/* ---------------- state ---------------- */
let montagens = [];
let assistencias = [];
let currentView = 'dashboard';
let dataReady = false;
let currentUser = null; // { name, role: 'montador' | 'gestor' }
const GESTOR_PIN = '258963'; // altere este código para a senha de acesso do gestor/supervisor
const WHATSAPP_NUMERO = ''; // opcional: coloque um número fixo (com DDI+DDD, só números, ex: 5511999998888) para sempre enviar ao mesmo contato/grupo. Deixe vazio para escolher o destinatário na hora.

const COMISSAO_PERCENTUAL = 0.012; // 1,2%

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function normalizeName(s){ return (s||'').trim().toLowerCase(); }
function visibleMontagens(){
  if(!currentUser) return [];
  if(currentUser.role === 'gestor') return montagens;
  return montagens.filter(m => normalizeName(m.montador) === normalizeName(currentUser.name));
}
function listaMontadores(){
  const nomes = new Set();
  montagens.forEach(m => { if(m.montador) nomes.add(m.montador.trim()); });
  return Array.from(nomes).sort((a,b)=>a.localeCompare(b));
}
function calcComissao(valor){ return (Number(valor) || 0) * COMISSAO_PERCENTUAL; }
function formatBRL(v){ return (Number(v)||0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'}); }
function mesAtualStr(){ const n = new Date(); return n.getFullYear() + '-' + String(n.getMonth()+1).padStart(2,'0'); }
function mesDaData(iso){ return iso ? iso.slice(0,7) : ''; }
function statusMontagem(m){ return m.dataTermino ? 'Concluído' : 'Em andamento'; }
function statusMontagemClass(m){ return m.dataTermino ? 'green' : 'blue'; }

function nextNumero(list, prefix){
  const year = new Date().getFullYear();
  const seq = (list.filter(x => x.numero && x.numero.includes(String(year))).length + 1).toString().padStart(4,'0');
  return prefix + '-' + year + '-' + seq;
}

function fmtDate(iso){
  if(!iso) return '—';
  const [y,m,d] = iso.split('-');
  if(!y||!m||!d) return iso;
  return d+'/'+m+'/'+y;
}
function todayISO(){ return new Date().toISOString().slice(0,10); }

/* ---------------- storage ---------------- */
async function loadData(){
  try{
    const m = await window.storage.get('sherman_montagens', true);
    montagens = m ? JSON.parse(m.value) : [];
  }catch(e){ montagens = []; }
  try{
    const a = await window.storage.get('sherman_assistencias', true);
    assistencias = a ? JSON.parse(a.value) : [];
  }catch(e){ assistencias = []; }
  try{
    const u = await window.storage.get('sherman_current_user', false);
    currentUser = (u && u.value) ? JSON.parse(u.value) : null;
  }catch(e){ currentUser = null; }
  dataReady = true;
  updateCounts();
  render();
}
async function salvarUsuarioLogado(){
  try{ await window.storage.set('sherman_current_user', JSON.stringify(currentUser), false); }
  catch(e){ /* login continua funcionando mesmo se não conseguir lembrar da próxima vez */ }
}
async function esquecerUsuarioLogado(){
  try{ await window.storage.delete('sherman_current_user', false); }
  catch(e){ /* ignora se já não existir */ }
}
async function saveMontagens(){
  try{
    await window.storage.set('sherman_montagens', JSON.stringify(montagens), true);
    const check = await window.storage.get('sherman_montagens', true);
    const salvos = check ? JSON.parse(check.value) : [];
    if(salvos.length !== montagens.length){
      toast('Atenção: o salvamento não foi confirmado pelo servidor. Anote os dados e tente novamente.', true);
    }
  }catch(e){ toast('Erro ao salvar. Tente novamente.', true); }
}
async function saveAssistencias(){
  try{
    await window.storage.set('sherman_assistencias', JSON.stringify(assistencias), true);
    const check = await window.storage.get('sherman_assistencias', true);
    const salvos = check ? JSON.parse(check.value) : [];
    if(salvos.length !== assistencias.length){
      toast('Atenção: o salvamento não foi confirmado pelo servidor. Anote os dados e tente novamente.', true);
    }
  }catch(e){ toast('Erro ao salvar. Tente novamente.', true); }
}

function updateCounts(){
  document.getElementById('count-montagens').textContent = currentUser ? visibleMontagens().length : montagens.length;
  document.getElementById('count-assistencias').textContent = assistencias.filter(a=>a.status!=='Resolvido' && a.status!=='Cancelado').length;
  const foot = document.getElementById('sidebar-foot');
  if(foot){
    foot.innerHTML = currentUser
      ? `Conectado como <b style="color:var(--text);">${escapeHTML(currentUser.name)}</b> · ${currentUser.role==='gestor' ? 'Gestor' : 'Montador'}<br><span id="switch-user" style="color:var(--orange);cursor:pointer;text-decoration:underline;">Trocar usuário</span>`
      : 'Dados salvos e compartilhados entre todos os usuários desta ferramenta.';
    const sw = document.getElementById('switch-user');
    if(sw) sw.addEventListener('click', async ()=>{ currentUser = null; await esquecerUsuarioLogado(); currentView='dashboard'; document.getElementById('sidebar').style.display='none'; render(); });
  }
}

function toast(msg, isError){
  const t = document.createElement('div');
  t.className = 'toast';
  if(isError){ t.style.borderLeftColor = 'var(--red)'; t.style.maxWidth = '320px'; t.style.cursor = 'pointer'; t.title = 'Toque para fechar'; t.addEventListener('click', ()=>t.remove()); }
  t.textContent = msg;
  document.body.appendChild(t);
  if(!isError) setTimeout(()=>t.remove(), 3200);
}

/* Captura qualquer erro de JavaScript não tratado e mostra na tela,
   em vez de falhar silenciosamente (essencial para diagnosticar problemas
   em navegadores/dispositivos onde não dá pra ver o console). */
window.addEventListener('error', function(e){
  toast('Erro no app: ' + (e.message || 'erro desconhecido') + (e.filename ? ' (linha ' + e.lineno + ')' : ''), true);
});
window.addEventListener('unhandledrejection', function(e){
  const msg = (e.reason && e.reason.message) ? e.reason.message : String(e.reason);
  toast('Erro no app: ' + msg, true);
});

/* ---------------- nav ---------------- */
document.querySelectorAll('.nav-item').forEach(el=>{
  el.addEventListener('click', ()=>{
    currentView = el.dataset.view;
    document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebar-overlay').classList.remove('open');
    render();
  });
});
document.getElementById('mobile-menu-btn').addEventListener('click', ()=>{
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebar-overlay').classList.toggle('open');
});
document.getElementById('sidebar-overlay').addEventListener('click', ()=>{
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-overlay').classList.remove('open');
});
function setActiveNav(view){
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active', n.dataset.view===view));
}

/* ---------------- render router ---------------- */
function render(){
  if(!dataReady) return;
  const main = document.getElementById('main');
  const sidebar = document.getElementById('sidebar');
  const menuBtn = document.getElementById('mobile-menu-btn');
  if(!currentUser){
    sidebar.style.display = 'none';
    menuBtn.style.display = 'none';
    return renderLogin(main);
  }
  sidebar.style.display = 'flex';
  menuBtn.style.display = '';
  updateCounts();
  setActiveNav(currentView);
  if(currentView === 'dashboard') return renderDashboard(main);
  if(currentView === 'nova-montagem') return renderNovaMontagem(main);
  if(currentView === 'montagens') return renderMontagens(main);
  if(currentView === 'nova-assistencia') return renderNovaAssistencia(main);
  if(currentView === 'assistencias') return renderAssistencias(main);
  if(currentView === 'detalhe-montagem') return renderDetalheMontagem(main, window.__viewId);
  if(currentView === 'detalhe-assistencia') return renderDetalheAssistencia(main, window.__viewId);
  if(currentView === 'backup') return renderBackup(main);
}

/* ---------------- login gate ---------------- */
function renderLogin(main){
  const montadores = listaMontadores();
  main.innerHTML = `
    <div style="max-width:420px;margin:60px auto 0 auto;">
      <div style="text-align:center;margin-bottom:24px;">
        <div class="lider-logo" style="display:inline-block;padding:18px 24px 15px 24px;margin-bottom:18px;">
          <div class="wordmark" style="font-size:26px;">LIDER</div>
          <span class="tagline">Gestão de Montagem</span>
        </div>
        <h1 style="font-family:var(--display);font-size:22px;margin:0 0 4px 0;">Identifique-se</h1>
        <p style="color:var(--text-dim);font-size:13px;margin:0;">Cada montador vê apenas seus próprios relatórios de montagem.</p>
      </div>

      <div class="form-card" style="padding:22px;">
        <div class="field">
          <label>Seu nome (montador)</label>
          <input type="text" id="login-nome" list="lista-montadores" placeholder="Digite ou selecione seu nome">
          <datalist id="lista-montadores">${montadores.map(n=>`<option value="${escapeHTML(n)}">`).join('')}</datalist>
        </div>
        <button class="btn" id="btn-login-montador" style="width:100%;justify-content:center;margin-top:4px;">Entrar como montador</button>

        <div style="display:flex;align-items:center;gap:10px;margin:20px 0;">
          <div style="flex:1;height:1px;background:var(--border);"></div>
          <span style="font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.5px;">ou</span>
          <div style="flex:1;height:1px;background:var(--border);"></div>
        </div>

        <div class="field">
          <label>Acesso de gestor / supervisor</label>
          <input type="text" id="login-nome-gestor" placeholder="Seu nome">
        </div>
        <div class="field">
          <input type="password" id="login-pin" placeholder="Código de acesso do gestor">
        </div>
        <button class="btn secondary" id="btn-login-gestor" style="width:100%;justify-content:center;">Entrar como gestor</button>
        <div id="login-erro" style="color:var(--red);font-size:12px;margin-top:10px;display:none;"></div>
      </div>
      <p style="color:var(--text-faint);font-size:11px;text-align:center;margin-top:14px;">
        Isto é uma identificação simples de uso interno, não uma senha de conta — use com bom senso.
      </p>
    </div>
  `;
  document.getElementById('btn-login-montador').addEventListener('click', async ()=>{
    const nome = document.getElementById('login-nome').value.trim();
    const err = document.getElementById('login-erro');
    if(!nome){ err.textContent = 'Digite seu nome para continuar.'; err.style.display='block'; return; }
    currentUser = { name: nome, role: 'montador' };
    await salvarUsuarioLogado();
    currentView = 'dashboard';
    render();
  });
  document.getElementById('btn-login-gestor').addEventListener('click', async ()=>{
    const nome = document.getElementById('login-nome-gestor').value.trim();
    const pin = document.getElementById('login-pin').value;
    const err = document.getElementById('login-erro');
    if(!nome){ err.textContent = 'Digite seu nome para continuar.'; err.style.display='block'; return; }
    if(pin !== GESTOR_PIN){ err.textContent = 'Código de acesso incorreto.'; err.style.display='block'; return; }
    currentUser = { name: nome, role: 'gestor' };
    await salvarUsuarioLogado();
    currentView = 'dashboard';
    render();
  });
}

function bindNavButtons(scope){

}
function emptyHTML(title, sub){
  return `<div class="empty"><b>${title}</b>${sub}</div>`;
}

/* ---------------- montagem: helpers ---------------- */
function ticketMontagemHTML(m){
  return `
  <div class="ticket" data-type="montagem" data-id="${m.id}">
    <span class="tnum">${m.numero}</span>
    <div class="tmain"><b>${escapeHTML(m.cliente)} — ${escapeHTML(m.codigoProjeto)}</b><small>${escapeHTML(m.montador)} · Valor ${formatBRL(m.valorProjeto)} · Comissão ${formatBRL(calcComissao(m.valorProjeto))}</small></div>
    <span class="badge ${statusMontagemClass(m)}">${statusMontagem(m)}</span>
    <span class="tdate">${fmtDate(m.dataInicio)}</span>
  </div>`;
}

function statusAssistClass(s){
  if(s==='Resolvido') return 'green';
  if(s==='Cancelado') return 'gray';
  if(s==='Aguardando peça') return 'amber';
  if(s==='Em andamento') return 'blue';
  return 'red';
}
function ticketAssistHTML(a){
  return `
  <div class="ticket" data-type="assistencia" data-id="${a.id}">
    <span class="tnum">${a.numero}</span>
    <div class="tmain"><b>${escapeHTML(a.cliente)} ${a.codigoItem ? '— ' + escapeHTML(a.codigoItem) : ''}</b><small>${escapeHTML(a.ambiente || '')}${a.motivo ? ' · ' + escapeHTML(a.motivo) : ''}</small></div>
    <span class="badge ${statusAssistClass(a.status)}">${a.status}</span>
    <span class="tdate">${fmtDate(a.dataAbertura)}</span>
  </div>`;
}
function bindTicketClicks(scope){
  scope.querySelectorAll('.ticket').forEach(t=>{
    t.addEventListener('click', ()=>{
      window.__viewId = t.dataset.id;
      currentView = t.dataset.type === 'montagem' ? 'detalhe-montagem' : 'detalhe-assistencia';
      render();
    });
  });
}
function escapeHTML(s){
  if(s===undefined || s===null) return '';
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

      <div class="stat-card accent-green"><div class="stat-num" id="sum-comissao" style="font-size:19px;">R$ 0,00</div><div class="stat-label">Comissão total (1,2%)</div></div>
    </div>
    <div class="card-list" id="montagens-list"></div>
  `;
  document.getElementById('mf-mes').value = mesAtualStr();
  bindNavButtons(main);

  function draw(){
    const q = document.getElementById('mf-search').value.toLowerCase();
    const periodo = document.getElementById('mf-periodo').value;
    const mesSel = document.getElementById('mf-mes').value;
    const mont = isGestor ? document.getElementById('mf-montador').value : '';
    let list = [...minhasMontagens].sort((a,b)=>b.criadoEm-a.criadoEm);
    if(periodo === 'mes' && mesSel) list = list.filter(m => mesDaData(m.dataInicio) === mesSel);
    if(q) list = list.filter(m => (m.cliente+m.codigoProjeto+m.numero).toLowerCase().includes(q));
    if(mont) list = list.filter(m => normalizeName(m.montador) === normalizeName(mont));

    const valorTotal = list.reduce((t,m)=> t + (Number(m.valorProjeto)||0), 0);
    const comissaoTotal = list.reduce((t,m)=> t + calcComissao(m.valorProjeto), 0);
    document.getElementById('sum-qtd').textContent = list.length;
    document.getElementById('sum-valor').textContent = formatBRL(valorTotal);
    document.getElementById('sum-comissao').textContent = formatBRL(comissaoTotal);

    const wrap = document.getElementById('montagens-list');
    wrap.innerHTML = list.length ? list.map(ticketMontagemHTML).join('') : emptyHTML('Nada encontrado', 'Ajuste os filtros ou registre uma nova montagem.');
    bindTicketClicks(wrap);
  }
  document.getElementById('mf-search').addEventListener('input', draw);
  document.getElementById('mf-periodo').addEventListener('change', draw);
  document.getElementById('mf-mes').addEventListener('change', draw);
  if(isGestor) document.getElementById('mf-montador').addEventListener('change', draw);
  draw();
}

function montarMensagemWhatsApp(a){
  const linhas = [
    '*SOLICITAÇÃO DE RECURSO PARA MONTAGEM*',
    'Nº ' + a.numero,
    '',
    '*Cliente:* ' + a.cliente,
    '*Código do item:* ' + a.codigoItem,
    '*Ambiente:* ' + a.ambiente,
    '',
    '*DETALHAMENTO DO PROBLEMA*',
    '*Situação:* ' + a.situacao,
    '*Motivo:* ' + a.motivo,
    a.acabamento ? '*Acabamento:* ' + a.acabamento : null,
    a.medidas ? '*Medidas:* ' + a.medidas : null,
    '',
    '*INFORMAÇÕES DE SERVIÇO*',
    '*Recurso necessário:* ' + a.recurso,
    a.tempoEstimado ? '*Tempo estimado de execução:* ' + a.tempoEstimado : null,
    a.observacao ? '' : null,
    a.observacao ? '*Observação:* ' + a.observacao : null
  ].filter(l => l !== null);
  return linhas.join('\n');
}

function enviarWhatsApp(a){
  const texto = encodeURIComponent(montarMensagemWhatsApp(a));
  const numero = WHATSAPP_NUMERO ? WHATSAPP_NUMERO.replace(/\D/g,'') : '';
  const url = numero ? `https://wa.me/${numero}?text=${texto}` : `https://wa.me/?text=${texto}`;
  window.open(url, '_blank');
}

      <h3 class="section-title" style="margin-top:0;">Baixar backup</h3>
      <p style="color:var(--text-dim);font-size:13px;margin:0 0 14px 0;">
        Gera um arquivo .json com todas as ${montagens.length} montagens e ${assistencias.length} assistências registradas até agora. Guarde esse arquivo em local seguro (e-mail, Drive) de tempos em tempos.
      </p>
      <button class="btn" id="btn-baixar-backup">Baixar backup (.json)</button>
    </div>

    <div class="form-card" style="max-width:640px;margin-top:20px;">
      <h3 class="section-title" style="margin-top:0;">Restaurar backup</h3>
      <p style="color:var(--text-dim);font-size:13px;margin:0 0 14px 0;">
        Selecione um arquivo de backup salvo anteriormente. Registros já existentes não são substituídos — apenas os que estiverem faltando são adicionados de volta.
      </p>
      <input type="file" id="input-backup" accept="application/json,.json" style="margin-bottom:12px;">
      <div id="backup-preview"></div>
    </div>
  `;
  document.getElementById('btn-baixar-backup').addEventListener('click', baixarBackup);

  document.getElementById('input-backup').addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (evt)=>{
      let dados;
      try{ dados = JSON.parse(evt.target.result); }
      catch(err){ document.getElementById('backup-preview').innerHTML = '<p style="color:var(--red);font-size:13px;">Arquivo inválido — não é um backup .json reconhecível.</p>'; return; }
      const mBackup = Array.isArray(dados.montagens) ? dados.montagens : [];
      const aBackup = Array.isArray(dados.assistencias) ? dados.assistencias : [];
      const idsMontagens = new Set(montagens.map(m=>m.id));
      const idsAssist = new Set(assistencias.map(a=>a.id));
      const novasMontagens = mBackup.filter(m=>m.id && !idsMontagens.has(m.id));
      const novasAssist = aBackup.filter(a=>a.id && !idsAssist.has(a.id));

      document.getElementById('backup-preview').innerHTML = `
        <div class="note-box" style="margin-bottom:12px;">
          Backup de ${dados.geradoEm ? fmtDate(dados.geradoEm.slice(0,10)) : 'data desconhecida'}.<br>
          Encontrados ${mBackup.length} montagens e ${aBackup.length} assistências no arquivo.<br>
          <b style="color:var(--green);">${novasMontagens.length} montagens</b> e <b style="color:var(--green);">${novasAssist.length} assistências</b> serão adicionadas (o restante já existe e será ignorado).
        </div>
        <button class="btn secondary" id="btn-confirmar-restauro" ${(novasMontagens.length+novasAssist.length)===0 ? 'disabled' : ''}>Confirmar restauração</button>
      `;
      const btn = document.getElementById('btn-confirmar-restauro');
      if(btn) btn.addEventListener('click', async ()=>{
        montagens = montagens.concat(novasMontagens);
        assistencias = assistencias.concat(novasAssist);
        await saveMontagens();
        await saveAssistencias();
        updateCounts();
        toast('Restauração concluída: ' + novasMontagens.length + ' montagens e ' + novasAssist.length + ' assistências adicionadas.');
        document.getElementById('backup-preview').innerHTML = '';
        document.getElementById('input-backup').value = '';
      });
    };
    reader.readAsText(file);
  });
}

function baixarBackup(){
  const payload = { geradoEm: new Date().toISOString(), montagens, assistencias };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = 'backup-lider-' + todayISO() + '.json';
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
  toast('Backup baixado.');
}

function gerarPDFAssistencia(a){
  if(!window.jspdf || !window.jspdf.jsPDF){
    toast('Gerador de PDF ainda carregando, tente novamente em alguns segundos.', true);
    return;
  }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const margemEsq = 18, margemDir = 192, larguraTexto = margemDir - 62;
  let y = 22;

  function quebraPagina(altura){
    if(y + altura > 280){ doc.addPage(); y = 22; }
  }
  function titulo(texto){
    quebraPagina(10);
    doc.setFont('helvetica','bold'); doc.setFontSize(11);
    doc.text(texto, margemEsq, y);
    y += 3;
    doc.setDrawColor(180,180,175);
    doc.line(margemEsq, y, margemDir, y);
    y += 7;
    doc.setFontSize(10);
  }
  function campo(label, valor){
    const lines = doc.splitTextToSize(valor && valor.trim() ? valor : '—', larguraTexto);
    quebraPagina(lines.length * 5 + 2);
    doc.setFont('helvetica','bold');
    doc.text(label, margemEsq, y);
    doc.setFont('helvetica','normal');
    doc.text(lines, 62, y);
    y += Math.max(6, lines.length * 5);
  }

  doc.setFont('helvetica','bold'); doc.setFontSize(15);
  doc.text('SOLICITAÇÃO DE RECURSO PARA MONTAGEM', margemEsq, y);
  y += 7;
  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(110,110,103);
  doc.text('Nº ' + a.numero + '   ·   Status: ' + a.status + '   ·   Aberto em ' + fmtDate(a.dataAbertura), margemEsq, y);
  doc.setTextColor(0,0,0);
  y += 10;

  titulo('IDENTIFICAÇÃO');
  campo('Cliente:', a.cliente);
  campo('Código do item:', a.codigoItem);
  campo('Ambiente:', a.ambiente);
  y += 3;

  titulo('DETALHAMENTO DO PROBLEMA');
  campo('Situação:', a.situacao);
  campo('Motivo:', a.motivo);
  campo('Acabamento:', a.acabamento);
  campo('Medidas:', a.medidas);
  y += 3;

  titulo('INFORMAÇÕES DE SERVIÇO');
  campo('Recurso necessário:', a.recurso);
  campo('Tempo estimado:', a.tempoEstimado);

  if(a.observacao && a.observacao.trim()){
    y += 3;
    titulo('OBSERVAÇÃO');
    campo('', a.observacao);
  }

  doc.setFontSize(8); doc.setTextColor(150,150,145);
  doc.text('LIDER — Gestão de Montagem', margemEsq, 290);

  doc.save('Solicitacao_' + a.numero + '.pdf');
}

/* ---------------- lista assistências ---------------- */
function renderAssistencias(main){
  main.innerHTML = `
    <div class="topbar">
      <div><h1>Assistências técnicas</h1><p>${assistencias.length} chamado(s) registrado(s).</p></div>
      <button class="btn" data-nav="nova-assistencia">+ Abrir chamado</button>
    </div>
    <div class="filters">
      <input type="text" id="af-search" placeholder="Buscar por cliente, produto ou número...">
      <select id="af-status">
        <option value="">Todos os status</option>
        <option>Aberto</option><option>Em andamento</option><option>Aguardando peça</option><option>Resolvido</option><option>Cancelado</option>
      </select>
    </div>
    <div class="card-list" id="assist-list"></div>
  `;
  bindNavButtons(main);

  function draw(){
    const q = document.getElementById('af-search').value.toLowerCase();
    const st = document.getElementById('af-status').value;
    let list = [...assistencias].sort((a,b)=>b.criadoEm-a.criadoEm);
    if(q) list = list.filter(a => (a.cliente+(a.codigoItem||'')+a.numero).toLowerCase().includes(q));
    if(st) list = list.filter(a => a.status === st);
    const wrap = document.getElementById('assist-list');
    wrap.innerHTML = list.length ? list.map(ticketAssistHTML).join('') : emptyHTML('Nada encontrado', 'Ajuste os filtros ou abra um novo chamado.');
    bindTicketClicks(wrap);
  }
  document.getElementById('af-search').addEventListener('input', draw);
  document.getElementById('af-status').addEventListener('change', draw);
  draw();
}

/* ---------------- detalhe assistência ---------------- */
function renderDetalheAssistencia(main, id){
  const a = assistencias.find(x=>x.id===id);
  if(!a){ currentView='assistencias'; return render(); }
  main.innerHTML = `
    <div class="topbar no-print">
      <button class="btn ghost small" data-nav="assistencias">&larr; Voltar</button>
      <div style="display:flex;gap:8px;">
        <button class="btn secondary small" id="btn-whatsapp-assist">Reenviar via WhatsApp</button>
        <button class="btn secondary small" id="btn-pdf-assist">Baixar PDF</button>
        <button class="btn secondary small" id="btn-print-assist">Imprimir / exportar</button>
        <button class="btn secondary small" id="btn-excluir-assist" style="color:var(--red);">Excluir</button>
      </div>
    </div>
    <div class="detail-wrap">
      <div class="detail-head">
        <div>
          <div class="num">${a.numero} · Solicitação de recurso para montagem</div>
          <h2>${escapeHTML(a.cliente)}</h2>
          <div class="sub">${escapeHTML(a.codigoItem) || 'Sem código de item'} ${a.ambiente ? '· ' + escapeHTML(a.ambiente) : ''}</div>
        </div>
        <div class="stamp ${statusAssistClass(a.status)}">${a.status}</div>
      </div>
      <div class="detail-body">
        <div class="dl">
          <div><b>Código do item</b><span>${escapeHTML(a.codigoItem) || '—'}</span></div>
          <div><b>Ambiente</b><span>${escapeHTML(a.ambiente) || '—'}</span></div>
          <div><b>Data de abertura</b><span>${fmtDate(a.dataAbertura)}</span></div>
        </div>

        <b style="display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-faint);margin-bottom:6px;">Detalhamento do problema</b>
        <div class="note-box" style="margin-bottom:10px;"><b style="display:block;font-size:10.5px;color:var(--text-faint);margin-bottom:3px;">Situação</b>${escapeHTML(a.situacao) || '—'}</div>
        <div class="dl" style="margin-bottom:18px;">
          <div><b>Motivo</b><span>${escapeHTML(a.motivo) || '—'}</span></div>
          <div><b>Acabamento</b><span>${escapeHTML(a.acabamento) || '—'}</span></div>
          <div><b>Medidas</b><span>${escapeHTML(a.medidas) || '—'}</span></div>
        </div>

        <b style="display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-faint);margin-bottom:6px;">Informações de serviço</b>
        <div class="dl" style="margin-bottom:10px;">
          <div><b>Tempo estimado de execução</b><span>${escapeHTML(a.tempoEstimado) || '—'}</span></div>
        </div>
        <div class="note-box"><b style="display:block;font-size:10.5px;color:var(--text-faint);margin-bottom:3px;">Recurso necessário</b>${escapeHTML(a.recurso) || '—'}</div>

        ${a.observacao ? `<b style="display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-faint);margin:18px 0 6px 0;">Observação</b><div class="note-box">${escapeHTML(a.observacao)}</div>` : ''}

        <div class="history">
          <b style="display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-faint);margin-bottom:4px;">Histórico</b>
          ${a.historico.slice().reverse().map(h=>`<div class="history-item"><span class="hdate">${new Date(h.data).toLocaleString('pt-BR')}</span><span class="htxt">${escapeHTML(h.texto)}</span></div>`).join('')}

          <div class="status-update no-print">
            <select id="upd-status">
              <option ${a.status==='Aberto'?'selected':''}>Aberto</option>
              <option ${a.status==='Em andamento'?'selected':''}>Em andamento</option>
              <option ${a.status==='Aguardando peça'?'selected':''}>Aguardando peça</option>
              <option ${a.status==='Resolvido'?'selected':''}>Resolvido</option>
              <option ${a.status==='Cancelado'?'selected':''}>Cancelado</option>
            </select>
            <input type="text" id="upd-nota" placeholder="Nota sobre esta atualização (opcional)">
            <button class="btn small" id="upd-btn">Atualizar</button>
          </div>
        </div>

        <div id="confirma-exclusao-assist" class="no-print"></div>
      </div>
    </div>
  `;
  bindNavButtons(main);
  document.getElementById('btn-print-assist').addEventListener('click', ()=>{ window.print(); });
  document.getElementById('btn-pdf-assist').addEventListener('click', ()=>{ try{ gerarPDFAssistencia(a); }catch(err){ toast('Erro ao gerar o PDF.', true); } });
  document.getElementById('btn-whatsapp-assist').addEventListener('click', ()=>{ try{ enviarWhatsApp(a); }catch(err){ toast('Não foi possível abrir o WhatsApp neste navegador.', true); } });
  document.getElementById('upd-btn').addEventListener('click', async ()=>{
    const novoStatus = document.getElementById('upd-status').value;
    const nota = document.getElementById('upd-nota').value.trim();
    a.status = novoStatus;
    a.historico.push({data: Date.now(), texto: 'Status alterado para "' + novoStatus + '".' + (nota ? ' ' + nota : '')});
    await saveAssistencias();
    updateCounts();
    toast('Chamado atualizado.');
    render();
  });
  document.getElementById('btn-excluir-assist').addEventListener('click', ()=>{
    document.getElementById('confirma-exclusao-assist').innerHTML = `
      <div class="note-box" style="margin-top:18px;border-color:var(--red);">
        <b style="color:var(--red);display:block;margin-bottom:8px;">Excluir este chamado?</b>
        Essa ação não pode ser desfeita. O chamado ${a.numero} — ${escapeHTML(a.cliente)} será apagado.
        <div style="margin-top:12px;display:flex;gap:8px;">
          <button class="btn small" id="btn-confirmar-exclusao-assist" style="background:var(--red);">Sim, excluir</button>
          <button class="btn secondary small" id="btn-cancelar-exclusao-assist">Cancelar</button>
        </div>
      </div>
    `;
    document.getElementById('btn-cancelar-exclusao-assist').addEventListener('click', ()=>{
      document.getElementById('confirma-exclusao-assist').innerHTML = '';
    });
    document.getElementById('btn-confirmar-exclusao-assist').addEventListener('click', async ()=>{
      assistencias = assistencias.filter(x=>x.id !== a.id);
      await saveAssistencias();
      updateCounts();
      toast('Chamado ' + a.numero + ' excluído.');
      currentView = 'assistencias';
      render();
    });
  });
}

loadData();
